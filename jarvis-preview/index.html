<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JARVIS — Voice Assistant</title>
<style>
  :root { --bg:#05070d; --panel:#0a1322; --line:rgba(53,224,255,.18);
    --text:#d8f4ff; --muted:#6f8ba0; --accent:#35e0ff; --accent2:#6bffe1; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family:'Segoe UI', system-ui, sans-serif; display:flex; min-height:100vh; }
  #wrap { width:100%; max-width:520px; margin:auto; padding:20px; }
  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .logo { display:flex; align-items:center; gap:10px; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--accent);
    box-shadow:0 0 12px var(--accent); }
  h1 { font-size:16px; letter-spacing:3px; margin:0; }
  #status { font-size:12px; color:var(--accent2); letter-spacing:1px; }
  #chat { background:rgba(0,0,0,.25); border:1px solid var(--line); border-radius:16px;
    height:46vh; overflow-y:auto; padding:14px; margin-bottom:14px; }
  #chat .row { margin:8px 0; max-width:85%; padding:9px 12px; border-radius:14px; font-size:14px; }
  #chat .you { background:#0a2e45; margin-left:auto; }
  #chat .jar { background:rgba(53,224,255,.08); border:1px solid var(--line); }
  #chat .who { font-size:10px; opacity:.7; margin-bottom:3px; }
  #inputRow { display:flex; gap:10px; }
  #ask { flex:1; background:#0a1322; color:var(--text); border:1px solid var(--line);
    padding:13px 14px; border-radius:14px; font-size:15px; }
  #ask:focus { outline:1px solid var(--accent); }
  .send { background:var(--accent); color:#001a22; border:none; border-radius:14px;
    width:52px; font-size:20px; cursor:pointer; }
  .send:active { transform:scale(.95); }
  #mic { background:transparent; border:1px solid var(--line); color:var(--accent);
    border-radius:14px; padding:10px 16px; font-size:13px; cursor:pointer; margin-top:10px; }
  .hint { color:var(--muted); font-size:12px; margin-top:14px; line-height:1.6; }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <div class="logo"><span class="dot"></span><h1>JARVIS</h1></div>
    <span id="status">Ready</span>
  </header>

  <div id="chat">
    <div class="row jar"><div class="who">JARVIS</div>Hey. I'm your voice assistant. Type a command, or tap the mic and talk.</div>
  </div>

  <div id="inputRow">
    <input id="ask" placeholder="Try: open WhatsApp · any messages? · battery · remember …" autofocus />
    <button class="send" id="sendBtn">➤</button>
  </div>
  <button id="mic">🎤 Tap to talk</button>

  <p class="hint">
    This is the current control surface. In the Android app this becomes real voice:
    wake word → listens → understands → does the action → speaks back.
  </p>
</div>

<script>
const chat = document.getElementById('chat');
const ask = document.getElementById('ask');
const statusEl = document.getElementById('status');
const micBtn = document.getElementById('mic');

function say(who,text){
  const row=document.createElement('div'); row.className='row '+who;
  const w=document.createElement('div'); w.className='who'; w.textContent=who==='you'?'You':'JARVIS';
  row.appendChild(w); row.appendChild(document.createTextNode(text));
  chat.appendChild(row); chat.scrollTop=chat.scrollHeight;
}

function setStatus(s){ statusEl.textContent=s; }

function handle(q){
  say('you', q); setStatus('Processing…');
  const l=q.toLowerCase();
  setTimeout(()=>{
    let reply='';
    if(l.startsWith('open ')||l.startsWith('launch ')){ reply='Opening '+q.split(' ').pop()+'.'; }
    else if(l.includes('any messages')){ reply='You have 1 new message from John.'; }
    else if(l.includes('what did he say')||l.includes('did he say')){ reply='He said: "I want to see you."'; }
    else if(l.includes('reply')){ reply='Draft ready: "Bet he can\'t 😂". Say "send" to confirm.'; }
    else if(l.trim()==='send'){ reply='Sent. ✅'; }
    else if(l.includes('battery')){ reply='Battery is 76% and not charging.'; }
    else if(l.includes('remember')){ reply="Got it. I'll remember: "+q.replace(/remember\s+(that\s+)?/i,''); }
    else if(l.includes('forget')){ reply='Forgot that.'; }
    else { reply='I got that: "'+q+'".'; }
    say('jar', reply); setStatus('Ready');
  }, 450);
}

function send(){ const v=ask.value.trim(); if(!v) return; ask.value=''; handle(v); }
sendBtn.addEventListener('click', send);
ask.addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });

micBtn.addEventListener('click', ()=>{
  setStatus('Listening…');
  micBtn.textContent='● Listening — tap to stop';
  setTimeout(()=>{
    micBtn.textContent='🎤 Tap to talk';
    setStatus('Ready');
    handle('any messages?');
  }, 1600);
});
</script>
</body>
</html>
