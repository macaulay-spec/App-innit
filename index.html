<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05060b" />
    <meta name="description" content="Jagflix — a premium streaming experience. Watch movies and series in stunning quality." />
    <meta property="og:site_name" content="Jagflix" />
    <meta property="og:title" content="Jagflix — Watch movies & series" />
    <meta property="og:description" content="A premium streaming experience with aurora-grade design." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2322d3ee'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%2305060b'/%3E%3Cpath d='M40 12v28a10 10 0 0 1-10 10H22v-8h8a2 2 0 0 0 2-2V12z' fill='url(%23g)'/%3E%3Cpath d='M44 26l10 6-10 6z' fill='url(%23g)'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Instrument+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Jagflix — Watch movies & series</title>
  </head>
  <body>
    <!-- Pre-React crash catcher: surfaces any JS error as a visible overlay,
         even if the app bundle itself fails to boot. -->
    <script>
      (function () {
        function showErr(msg) {
          var d = document.getElementById("jf-debug");
          if (!d) {
            d = document.createElement("div");
            d.id = "jf-debug";
            d.style.cssText =
              "position:fixed;left:8px;right:8px;bottom:8px;z-index:99999;background:#2a0a12;color:#ffb4c4;border:1px solid #f43f5e;border-radius:12px;padding:10px 12px;font:12px/1.5 monospace;white-space:pre-wrap;max-height:45vh;overflow:auto";
            (document.body || document.documentElement).appendChild(d);
          }
          d.textContent = (d.textContent ? d.textContent + "\n" : "") + msg;
        }
        window.addEventListener(
          "error",
          function (e) {
            showErr(
              "JS error: " +
                (e.message || "(no message)") +
                (e.filename ? " @ " + String(e.filename).split("/").slice(-1)[0] + ":" + e.lineno : ""),
            );
          },
          true,
        );
        window.addEventListener("unhandledrejection", function (e) {
          var r = e.reason;
          showErr("unhandled rejection: " + (r && r.message ? r.message : String(r)));
        });
        // boot watchdog: if React never mounts (splash still present), say so
        setTimeout(function () {
          if (document.getElementById("splash")) {
            showErr("boot watchdog: React did not mount within 6s (bundle may have failed to load)");
          }
        }, 6000);
        window.__jfShowErr = showErr;
      })();
    </script>
    <div id="root">
      <!-- Boot splash (mockup #1) — replaced when React mounts -->
      <style>
        #splash {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 42px;
          background:
            radial-gradient(60% 50% at 20% 30%, rgba(88, 61, 255, 0.16), transparent 60%),
            radial-gradient(50% 45% at 80% 60%, rgba(34, 211, 238, 0.14), transparent 60%),
            #05060b;
        }
        #splash .word {
          font-family: "Space Grotesk", system-ui, sans-serif;
          font-weight: 700;
          font-size: clamp(34px, 7vw, 64px);
          letter-spacing: 0.16em;
          background: linear-gradient(95deg, #22d3ee, #60a5fa 45%, #a78bfa);
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
          text-transform: uppercase;
        }
        #splash .bar {
          width: min(420px, 70vw);
          height: 10px;
          border-radius: 99px;
          border: 1px solid rgba(167, 139, 250, 0.45);
          padding: 2px;
        }
        #splash .bar i {
          display: block;
          height: 100%;
          border-radius: 99px;
          background: linear-gradient(90deg, #22d3ee, #67e8f9);
          box-shadow: 0 0 18px rgba(34, 211, 238, 0.55);
          animation: jf-load 1.4s cubic-bezier(0.3, 0.8, 0.4, 1) infinite;
          transform-origin: left;
        }
        @keyframes jf-load {
          0% { width: 8%; }
          60% { width: 78%; }
          100% { width: 92%; }
        }
      </style>
      <div id="splash" aria-hidden="true">
        <div class="word">Jagflix</div>
        <div class="bar"><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
